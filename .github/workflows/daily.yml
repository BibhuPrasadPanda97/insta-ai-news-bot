name: Daily AI news post

on:
  schedule:
    - cron: "30 5 * * *"      # 05:30 UTC = 11:00 IST
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Instagram (otherwise draft only)"
        type: boolean
        default: false

permissions:
  contents: write             # needed to push slides to the `slides` branch

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Inter font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-inter || echo "falling back to DejaVu"

      - name: Build the brief
        env:
          # WRITER=rules is free and needs no key. Set the repository variable to
          # "claude" (and add ANTHROPIC_API_KEY) for better-written copy.
          WRITER: ${{ vars.WRITER || 'rules' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_HANDLE: "@poweraidaily"
        run: python src/run.py

      - name: Show the brief in the run summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("out/stories.json"))
          print(f"## Brief for {d['date']}\n")
          for i, s in enumerate(d["stories"], 1):
              print(f"**{i}. {s['headline']}**  \n`{s['category']}` from [{s['source']}]({s['url']})\n")
              for b in s["bullets"]:
                  print(f"- {b}")
              print()
          print(f"\nCaption: {len(open('out/caption.txt').read())} characters")
          EOF
          echo "----- stories.json -----"
          cat out/stories.json

      - name: Upload slides for review
        uses: actions/upload-artifact@v4
        with:
          name: daily-brief
          path: out/
          retention-days: 14

      # --- everything below runs only when publishing ---

      - name: Host the slides on the slides branch
        if: ${{ inputs.publish == true && vars.UPLOADER != 'imgbb' }}
        id: host
        run: |
          set -euo pipefail
          day=$(date -u +%Y-%m-%d)
          tmp=$(mktemp -d)
          git clone --depth 1 --branch slides "${{ github.server_url }}/${{ github.repository }}" "$tmp" \
            || { git init "$tmp" && git -C "$tmp" checkout -b slides; }
          mkdir -p "$tmp/$day"
          cp out/slide_*.jpg "$tmp/$day/"
          git -C "$tmp" -c user.email=actions@github.com -c user.name="GitHub Actions" \
            add -A
          git -C "$tmp" -c user.email=actions@github.com -c user.name="GitHub Actions" \
            commit -m "slides for $day" || echo "nothing new"
          git -C "$tmp" push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" slides
          owner=$(echo "${{ github.repository }}" | cut -d/ -f1 | tr 'A-Z' 'a-z')
          name=$(echo "${{ github.repository }}" | cut -d/ -f2)
          echo "base=https://$owner.github.io/$name/$day" >> "$GITHUB_OUTPUT"

      - name: Publish to Instagram
        if: ${{ inputs.publish == true }}
        env:
          WRITER: ${{ vars.WRITER || 'rules' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_HANDLE: "@poweraidaily"
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          UPLOADER: ${{ vars.UPLOADER || 'gh_pages' }}
          SLIDES_BASE_URL: ${{ steps.host.outputs.base }}
          PUBLISH: "1"
        run: python src/run.py
