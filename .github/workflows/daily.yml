name: Daily AI news post

on:
  schedule:
    - cron: "30 5 * * *"      # 05:30 UTC = 11:00 IST
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Instagram (otherwise draft only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Inter font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-inter || true

      - name: Build the brief
        env:
          # WRITER=rules is free and needs no key. Set it to "claude" (and add the
          # ANTHROPIC_API_KEY secret) for better-written headlines and bullets.
          WRITER: ${{ vars.WRITER || 'rules' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_HANDLE: "@poweraidaily"
        run: python src/run.py

      - name: Upload slides for review
        uses: actions/upload-artifact@v4
        with:
          name: daily-brief
          path: out/
          retention-days: 14

      # Publishing stays off until the Instagram credentials are in place.
      # Instagram fetches images from a public URL, so the slides are uploaded
      # first and their URLs passed to the publish step.
      - name: Publish to Instagram
        if: ${{ inputs.publish == true }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PUBLISH: "1"
        run: echo "wire image hosting, then call src/run.py with SLIDE_URLS"
